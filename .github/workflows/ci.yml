name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Caché del binario de MongoDB (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Pruebas (unitarias + integración)
        run: npm test

      - name: Build del cliente
        run: npm run build
